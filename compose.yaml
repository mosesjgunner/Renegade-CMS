name: renegade-cms

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: renegade
      POSTGRES_USER: renegade
      POSTGRES_PASSWORD: renegade_dev_only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renegade -d renegade']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - renegade_postgres_data:/var/lib/postgresql/data

volumes:
  renegade_postgres_data:
