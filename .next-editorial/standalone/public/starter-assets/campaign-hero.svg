<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Forward for the People Campaign Rally Banner">
  <defs>
    <linearGradient id="campBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#f5eee2" />
    </linearGradient>
    <linearGradient id="partyRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aa1d2f" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="civicBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005ea8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#campBg)" />
  
  <!-- Dynamic Angular Campaign Stripes -->
  <polygon points="0,0 480,0 240,675 0,675" fill="#fbebe8" opacity="0.7" />
  <polygon points="480,0 520,0 280,675 240,675" fill="#aa1d2f" opacity="0.8" />
  <polygon points="1000,0 1200,0 1200,320" fill="#e8f3fb" />
  <polygon points="1120,0 1200,0 1200,120" fill="#005ea8" opacity="0.3" />

  <!-- Left / Main Typography -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#aa1d2f" />
    <text x="110" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">OFFICIAL CAMPAIGN 2026</text>
    
    <text x="0" y="96" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#171719" letter-spacing="-1.5">FORWARD FOR</text>
    <text x="0" y="160" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#partyRed)" letter-spacing="-1.5">THE COMMONS</text>
    <text x="0" y="210" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#4b4742">
      Zero-Emission Rapid Transit • Fair Work • 100% People Powered
    </text>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#d5cbbe" stroke-width="2" />
    
    <!-- Action Metrics Banner -->
    <g transform="translate(0, 265)">
      <rect x="0" y="0" width="180" height="74" rx="10" fill="#ffffff" stroke="#e0d6c8" stroke-width="2" />
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#aa1d2f">$185,420</text>
      <text x="20" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#716b64">OF $250,000 GOAL</text>

      <rect x="200" y="0" width="180" height="74" rx="10" fill="#ffffff" stroke="#e0d6c8" stroke-width="2" />
      <text x="220" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#005ea8">12,450+</text>
      <text x="220" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#716b64">CO-SPONSORS</text>
      
      <rect x="400" y="0" width="180" height="74" rx="10" fill="#ffffff" stroke="#e0d6c8" stroke-width="2" />
      <text x="420" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#15803d">100%</text>
      <text x="420" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#716b64">GRASSROOTS FUNDED</text>
    </g>
  </g>

  <!-- Right Visual: Campaign Emblem / Megaphone / Transit Icon -->
  <g transform="translate(800, 160)">
    <circle cx="160" cy="160" r="160" fill="url(#civicBlue)" opacity="0.1" />
    <circle cx="160" cy="160" r="130" fill="#ffffff" stroke="#aa1d2f" stroke-width="4" stroke-dasharray="10 6" />
    <!-- Megaphone Symbol -->
    <path d="M 110 130 L 170 95 L 210 95 L 210 225 L 170 225 L 110 190 Z" fill="#aa1d2f" />
    <polygon points="170,95 210,95 210,225 170,225" fill="#881322" />
    <rect x="90" y="145" width="22" height="30" rx="4" fill="#171719" />
    <path d="M 120 190 L 135 240 L 155 240 L 145 190 Z" fill="#171719" />
    <!-- Radiating Voice Waves -->
    <path d="M 225 130 A 30 30 0 0 1 225 190" fill="none" stroke="#005ea8" stroke-width="6" stroke-linecap="round" />
    <path d="M 245 110 A 60 60 0 0 1 245 210" fill="none" stroke="#005ea8" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
