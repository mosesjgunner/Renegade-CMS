<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Grassroots Enamel Pin Set (3-Pack)">
  <rect width="600" height="600" fill="#f5f3ee" rx="16" />
  <g transform="translate(100, 100)">
    <!-- Backer Card -->
    <rect x="20" y="20" width="360" height="360" rx="12" fill="#faf8f5" stroke="#d5cbbe" stroke-width="3" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))" />
    <text x="200" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#aa1d2f" text-anchor="middle" letter-spacing="2">CAMPAIGN COLLECTOR PINS</text>
    
    <!-- Pin 1: Red Emblem -->
    <circle cx="120" cy="180" r="50" fill="#aa1d2f" stroke="#e0d6c8" stroke-width="4" />
    <circle cx="120" cy="180" r="42" fill="#881322" />
    <text x="120" y="186" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">VOTE</text>
    
    <!-- Pin 2: Blue Transit Pin -->
    <circle cx="280" cy="180" r="50" fill="#005ea8" stroke="#e0d6c8" stroke-width="4" />
    <circle cx="280" cy="180" r="42" fill="#034b82" />
    <text x="280" y="186" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">TRANSIT</text>
    
    <!-- Pin 3: Clean Sun Pin -->
    <circle cx="200" cy="290" r="55" fill="#f59e0b" stroke="#e0d6c8" stroke-width="4" />
    <circle cx="200" cy="290" r="46" fill="#d97706" />
    <text x="200" y="296" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">CLEAN</text>
  </g>
</svg>
