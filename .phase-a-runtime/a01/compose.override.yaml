services:
  postgres:
    ports: !override
      - '127.0.0.1:3101:5432'
    environment:
      POSTGRES_DB: renegade_phase_a01
      POSTGRES_USER: renegade
      POSTGRES_PASSWORD: renegade_dev_only
    volumes:
      - renegade_phase_a01_postgres:/var/lib/postgresql/data

volumes:
  renegade_phase_a01_postgres:
    name: renegade_phase_a01_postgres
