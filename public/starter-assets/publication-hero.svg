<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The Vanguard Chronicle Editorial Cover Art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f0" />
      <stop offset="100%" stop-color="#ede6dc" />
    </linearGradient>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191614" />
      <stop offset="100%" stop-color="#3d3733" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#191614" stroke-width="1" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>
  <!-- Decorative Editorial Border -->
  <rect x="30" y="30" width="1140" height="615" fill="none" stroke="#d4cbbe" stroke-width="2" rx="12" />
  <rect x="42" y="42" width="1116" height="591" fill="none" stroke="#e4dcd0" stroke-width="1" rx="8" />
  
  <!-- Left Column: Typography Motif -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="140" height="8" fill="url(#accentGrad)" rx="4" />
    <text x="0" y="64" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="url(#inkGrad)" letter-spacing="-1">THE VANGUARD</text>
    <text x="0" y="112" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#857d74" letter-spacing="4">INDEPENDENT DISPATCHES &amp; COMMONS</text>
    <line x1="0" y1="140" x2="520" y2="140" stroke="#d4cbbe" stroke-width="1" />
    <text x="0" y="180" font-family="Georgia, serif" font-size="18" fill="#575048" font-style="italic">
      "Sovereign reporting, rigorous investigation, and participatory inquiry."
    </text>
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#f0ebe1" stroke="#d4cbbe" stroke-width="1" />
      <text x="60" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">ISSUE NO. 42</text>
      <rect x="135" y="0" width="160" height="32" rx="16" fill="#f0ebe1" stroke="#d4cbbe" stroke-width="1" />
      <text x="215" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#575048" text-anchor="middle">READER PATRONAGE</text>
    </g>
  </g>

  <!-- Right Visual: Architectural / Newspaper Geometric Motif -->
  <g transform="translate(720, 120)">
    <rect x="0" y="0" width="380" height="420" rx="16" fill="#ffffff" stroke="#d4cbbe" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.06))" />
    <rect x="24" y="24" width="332" height="180" rx="8" fill="#f3efe6" />
    <!-- Stylized Compass / Press Wheel -->
    <circle cx="190" cy="114" r="60" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="190" cy="114" r="44" fill="#ffffff" stroke="#d4cbbe" stroke-width="2" />
    <polygon points="190,75 198,114 190,105 182,114" fill="#b91c1c" />
    <polygon points="190,153 198,114 190,123 182,114" fill="#191614" />
    <!-- Newspaper Columns -->
    <rect x="24" y="224" width="156" height="12" rx="4" fill="#191614" />
    <rect x="24" y="248" width="156" height="6" rx="3" fill="#857d74" />
    <rect x="24" y="260" width="140" height="6" rx="3" fill="#857d74" />
    <rect x="24" y="272" width="150" height="6" rx="3" fill="#857d74" />
    <rect x="24" y="284" width="130" height="6" rx="3" fill="#857d74" />
    
    <rect x="200" y="224" width="156" height="12" rx="4" fill="#191614" />
    <rect x="200" y="248" width="156" height="6" rx="3" fill="#857d74" />
    <rect x="200" y="260" width="145" height="6" rx="3" fill="#857d74" />
    <rect x="200" y="272" width="156" height="6" rx="3" fill="#857d74" />
    <rect x="200" y="284" width="135" height="6" rx="3" fill="#857d74" />

    <line x1="24" y1="310" x2="356" y2="310" stroke="#e4dcd0" stroke-width="1" />
    <circle cx="40" cy="336" r="14" fill="#b91c1c" />
    <text x="64" y="340" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#191614">INVESTIGATIVE DESK</text>
    <text x="64" y="356" font-family="system-ui, sans-serif" font-size="10" fill="#857d74">Verified Civic Public Document</text>
  </g>
</svg>
