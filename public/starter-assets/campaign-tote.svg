<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Civic Action Canvas Field Tote">
  <rect width="600" height="600" fill="#f8f6f2" rx="16" />
  <g transform="translate(140, 70)">
    <!-- Tote Handles -->
    <path d="M 80 160 C 80 40, 240 40, 240 160" fill="none" stroke="#aa1d2f" stroke-width="22" stroke-linecap="round" />
    <!-- Tote Body -->
    <polygon points="40,160 280,160 260,450 60,450" fill="#f3ede1" stroke="#d5cbbe" stroke-width="4" />
    <!-- Center Graphic on Tote -->
    <rect x="90" y="240" width="140" height="120" rx="8" fill="#ffffff" stroke="#d5cbbe" stroke-width="2" />
    <text x="160" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#aa1d2f" text-anchor="middle">PEOPLE</text>
    <text x="160" y="305" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#171719" text-anchor="middle">POWER</text>
    <text x="160" y="330" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#005ea8" text-anchor="middle">ORGANIZING</text>
  </g>
</svg>
