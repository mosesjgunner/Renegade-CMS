name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: renegade_release_acceptance
          POSTGRES_USER: renegade
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renegade -d renegade_release_acceptance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://renegade:ci_test_only@127.0.0.1:5432/renegade_release_acceptance
      PAYLOAD_SECRET: ci-only-test-value-with-at-least-32-characters
      APP_URL: http://127.0.0.1:3100
      SMOKE_TEST_TOKEN: ci-only-smoke-token-with-24-characters
      UPGRADE_MIGRATION_DATABASE_URL: postgresql://renegade:ci_test_only@127.0.0.1:5432/renegade_upgrade_acceptance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Create upgrade migration acceptance database
        run: >-
          PGPASSWORD=ci_test_only psql
          --host=127.0.0.1 --username=renegade
          --dbname=renegade_release_acceptance
          --command='CREATE DATABASE renegade_upgrade_acceptance'
      - name: Run canonical clean-clone release verification
        run: npm run verify:release
