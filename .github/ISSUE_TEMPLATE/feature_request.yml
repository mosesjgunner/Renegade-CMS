name: 💡 Feature Request
description: Suggest an idea or enhancement for Renegade CMoS
title: '[Feature]: '
labels: ['enhancement', 'proposal']
body:
  - type: markdown
    attributes:
      value: |
        We appreciate ideas for making Renegade CMoS even more powerful and sovereign!
  - type: dropdown
    id: surface
    attributes:
      label: Target Product Surface
      options:
        - 'Surface 1: Content & Editorial Floor'
        - 'Surface 2: Presentation & Page Builder'
        - 'Surface 3: Media & DAM Governance'
        - 'Surface 4: Discovery & Distribution'
        - 'Surface 5: Workflow & Scheduled Releases'
        - 'Surface 6: Audience & Telecom'
        - 'Surface 7: Community & Real-Time Interaction'
        - 'Surface 8: Commerce Command Center'
        - 'Surface 9: Operations, Backup & Restore'
        - 'Other / Extension Ecosystem'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
