name: 🐛 Bug Report
description: Create a report to help us improve Renegade CMoS
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before reporting, please ensure the bug hasn't already been reported.
  - type: dropdown
    id: surface
    attributes:
      label: Affected Product Surface
      options:
        - 'Surface 1: Content & Editorial Floor'
        - 'Surface 2: Presentation & Page Builder'
        - 'Surface 3: Media & DAM Governance'
        - 'Surface 4: Discovery & Distribution'
        - 'Surface 5: Workflow & Scheduled Releases'
        - 'Surface 6: Audience & Telecom'
        - 'Surface 7: Community & Real-Time Interaction'
        - 'Surface 8: Commerce Command Center'
        - 'Surface 9: Operations, Backup & Restore'
        - 'Installation / Environment / Other'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, browser, Docker version, etc.
      placeholder: Node 24.19, Docker 24.0, Ubuntu 24.04, Chrome 128
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant terminal or browser console output.
      render: shell
