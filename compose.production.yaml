name: ${RENEGADE_INSTANCE:-renegade-cms}

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: renegade
      POSTGRES_USER: renegade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - renegade_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renegade -d renegade']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILD_SHA: ${BUILD_SHA:?Set BUILD_SHA to the exact full source commit}
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    environment: &app_environment
      NODE_ENV: production
      DATABASE_URL: postgresql://renegade:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/renegade
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env.production}
      AI_CREDENTIAL_KEY_BASE64URL: ${AI_CREDENTIAL_KEY_BASE64URL:-}
      RENEGADE_POD_ENCRYPTION_KEY: ${RENEGADE_POD_ENCRYPTION_KEY:-}
      RENEGADE_ENCRYPTION_KEY: ${RENEGADE_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      PROXY_MODE: ${PROXY_MODE:?Set PROXY_MODE in .env.production}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      STORAGE_DRIVER: local
      MEDIA_DIR: /app/media
      EMAIL_MODE: ${EMAIL_MODE:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_SEND_TIMEOUT_MS: ${SMTP_SEND_TIMEOUT_MS:-30000}
      # RC3-EMAIL-01: per-boundary Postmark configuration. Account and
      # audience credentials are passed as separate variables so no worker
      # profile needs the other boundary's secret in its own config; note
      # that containers sharing this environment block can still read both —
      # run the account worker as its own service with only the account
      # variables for hard secret isolation (see the operator runbook).
      EMAIL_ACCOUNT_PROVIDER: ${EMAIL_ACCOUNT_PROVIDER:-inherit}
      EMAIL_ACCOUNT_FROM: ${EMAIL_ACCOUNT_FROM:-}
      EMAIL_ACCOUNT_POSTMARK_SERVER_TOKEN: ${EMAIL_ACCOUNT_POSTMARK_SERVER_TOKEN:-}
      EMAIL_ACCOUNT_POSTMARK_TRANSACTIONAL_STREAM: ${EMAIL_ACCOUNT_POSTMARK_TRANSACTIONAL_STREAM:-outbound}
      EMAIL_ACCOUNT_POSTMARK_BROADCAST_STREAM: ${EMAIL_ACCOUNT_POSTMARK_BROADCAST_STREAM:-broadcast}
      EMAIL_ACCOUNT_POSTMARK_WEBHOOK_SECRET: ${EMAIL_ACCOUNT_POSTMARK_WEBHOOK_SECRET:-}
      EMAIL_ACCOUNT_DKIM_SELECTOR: ${EMAIL_ACCOUNT_DKIM_SELECTOR:-}
      EMAIL_ACCOUNT_RETURN_PATH_HOST: ${EMAIL_ACCOUNT_RETURN_PATH_HOST:-}
      EMAIL_AUDIENCE_PROVIDER: ${EMAIL_AUDIENCE_PROVIDER:-inherit}
      EMAIL_AUDIENCE_FROM: ${EMAIL_AUDIENCE_FROM:-}
      EMAIL_AUDIENCE_POSTMARK_SERVER_TOKEN: ${EMAIL_AUDIENCE_POSTMARK_SERVER_TOKEN:-}
      EMAIL_AUDIENCE_POSTMARK_TRANSACTIONAL_STREAM: ${EMAIL_AUDIENCE_POSTMARK_TRANSACTIONAL_STREAM:-outbound}
      EMAIL_AUDIENCE_POSTMARK_BROADCAST_STREAM: ${EMAIL_AUDIENCE_POSTMARK_BROADCAST_STREAM:-broadcast}
      EMAIL_AUDIENCE_POSTMARK_WEBHOOK_SECRET: ${EMAIL_AUDIENCE_POSTMARK_WEBHOOK_SECRET:-}
      EMAIL_AUDIENCE_DKIM_SELECTOR: ${EMAIL_AUDIENCE_DKIM_SELECTOR:-}
      EMAIL_AUDIENCE_RETURN_PATH_HOST: ${EMAIL_AUDIENCE_RETURN_PATH_HOST:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BUILD_SHA: ${BUILD_SHA}
      RENEGADE_IMAGE_TAG: ${RENEGADE_IMAGE_TAG:-local}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-Standard}
      ENABLE_TEST_ROUTES: 'false'
      LOCAL_E2E_TEST_MODE: ${LOCAL_E2E_TEST_MODE:-false}
      # Optional modules are opt-in. When enabled, the app keeps optional
      # collections available while disabling their Payload lock metadata so
      # the locked-documents query remains below PostgreSQL's limit.
      RENEGADE_MODULES: ${RENEGADE_MODULES:-}
      RENEGADE_ALLOW_UNSAFE_COLLECTION_COUNT: ${RENEGADE_ALLOW_UNSAFE_COLLECTION_COUNT:-false}
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  renegade-web:
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *app_environment
    ports:
      - '${RENEGADE_WEB_BIND:-127.0.0.1:3000}:3000'
    volumes:
      - renegade_media:/app/media
      - ./vendor/ffmpeg:/app/vendor/ffmpeg:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  renegade-worker:
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app_environment
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-10000}
      WORKER_HEARTBEAT_FILE: /tmp/renegade-worker/heartbeat.json
      WORKER_HEARTBEAT_MAX_AGE_MS: ${WORKER_HEARTBEAT_MAX_AGE_MS:-45000}
    command: ['npm', 'run', 'jobs:worker']
    volumes:
      - renegade_media:/app/media
      - ./vendor/ffmpeg:/app/vendor/ffmpeg:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'docker/worker-healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # RC3-EMAIL-01: dedicated account-mail worker. Runs ONLY the
  # account/operational outbox sweep (WORKER_PROFILE=account), so audience
  # floods, pauses, or revoked audience credentials cannot consume account
  # dispatch capacity. Enable with: docker compose --profile email-account up -d
  email-account-worker:
    profiles: ['email-account']
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app_environment
      WORKER_PROFILE: account
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-10000}
      WORKER_HEARTBEAT_FILE: /tmp/renegade-worker/account-heartbeat.json
      WORKER_HEARTBEAT_MAX_AGE_MS: ${WORKER_HEARTBEAT_MAX_AGE_MS:-45000}
    command: ['npm', 'run', 'jobs:worker']
    volumes:
      - renegade_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'docker/worker-healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  media-heavy:
    profiles: ['media-heavy']
    build:
      context: .
      target: media-heavy
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILD_SHA: ${BUILD_SHA:?Set BUILD_SHA to the exact full source commit}
    image: ${RENEGADE_MEDIA_HEAVY_IMAGE:-renegade-cms-media-heavy}:${RENEGADE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app_environment
      WORKER_PROFILE: media-heavy
      WORKER_POLL_INTERVAL_MS: ${MEDIA_HEAVY_POLL_INTERVAL_MS:-10000}
      WORKER_HEARTBEAT_FILE: /tmp/renegade-worker/media-heavy-heartbeat.json
      VIDEO_JOB_CONCURRENCY: ${VIDEO_JOB_CONCURRENCY:-1}
      VIDEO_FFMPEG_THREADS: ${VIDEO_FFMPEG_THREADS:-1}
      VIDEO_PROCESSOR: ${VIDEO_PROCESSOR:-local-ffmpeg}
    command: ['npm', 'run', 'jobs:worker']
    volumes:
      - renegade_media:/app/media
      - ./vendor/ffmpeg:/app/vendor/ffmpeg:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '${VIDEO_CPU_LIMIT:-2.0}'
          memory: ${VIDEO_MEMORY_LIMIT:-2G}

volumes:
  renegade_postgres_data:
  renegade_media:
