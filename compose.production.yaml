name: ${RENEGADE_INSTANCE:-renegade-cms}

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: renegade
      POSTGRES_USER: renegade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - renegade_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renegade -d renegade']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    environment: &app_environment
      NODE_ENV: production
      DATABASE_URL: postgresql://renegade:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/renegade
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env.production}
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      PROXY_MODE: ${PROXY_MODE:?Set PROXY_MODE in .env.production}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      STORAGE_DRIVER: local
      MEDIA_DIR: /app/media
      EMAIL_MODE: ${EMAIL_MODE:-disabled}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      RENEGADE_IMAGE_TAG: ${RENEGADE_IMAGE_TAG:-local}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-Standard}
      ENABLE_TEST_ROUTES: 'false'
      LOCAL_E2E_TEST_MODE: ${LOCAL_E2E_TEST_MODE:-false}
      RENEGADE_MODULES: ${RENEGADE_MODULES:-all}
      RENEGADE_ALLOW_UNSAFE_COLLECTION_COUNT: ${RENEGADE_ALLOW_UNSAFE_COLLECTION_COUNT:-true}
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  renegade-web:
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *app_environment
    ports:
      - '${RENEGADE_WEB_BIND:-127.0.0.1:3000}:3000'
    volumes:
      - renegade_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  renegade-worker:
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app_environment
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-10000}
      WORKER_HEARTBEAT_FILE: /tmp/renegade-worker/heartbeat.json
      WORKER_HEARTBEAT_MAX_AGE_MS: ${WORKER_HEARTBEAT_MAX_AGE_MS:-45000}
    command: ['npm', 'run', 'jobs:worker']
    volumes:
      - renegade_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'docker/worker-healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  media-heavy:
    profiles: ['media-heavy']
    build:
      context: .
      target: media-heavy
    image: ${RENEGADE_MEDIA_HEAVY_IMAGE:-renegade-cms-media-heavy}:${RENEGADE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app_environment
      WORKER_PROFILE: media-heavy
      WORKER_POLL_INTERVAL_MS: ${MEDIA_HEAVY_POLL_INTERVAL_MS:-10000}
      WORKER_HEARTBEAT_FILE: /tmp/renegade-worker/media-heavy-heartbeat.json
      VIDEO_JOB_CONCURRENCY: ${VIDEO_JOB_CONCURRENCY:-1}
      VIDEO_FFMPEG_THREADS: ${VIDEO_FFMPEG_THREADS:-1}
      VIDEO_PROCESSOR: ${VIDEO_PROCESSOR:-local-ffmpeg}
    command: ['npm', 'run', 'jobs:worker']
    volumes:
      - renegade_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '${VIDEO_CPU_LIMIT:-2.0}'
          memory: ${VIDEO_MEMORY_LIMIT:-2G}

volumes:
  renegade_postgres_data:
  renegade_media:
