upstream live_app { server renegade-web:3000; }
upstream live_ingest { server live-mediamtx:8889; }
upstream live_hls { server live-mediamtx:8888; }
upstream live_recordings { server live-mediamtx:9996; }

map $uri $live_delivery_kind {
    default "";
    ~^/live-media/[0-9a-f-]+/hls/[^/]+\.m3u8$ playlist;
    ~^/live-media/[0-9a-f-]+/hls/ segment;
    ~^/live-media/[0-9a-f-]+/replay$ replay;
}

log_format live_delivery escape=json
    '{"event":"live.gateway.delivery","time":"$time_iso8601","host":"$host",'
    '"kind":"$live_delivery_kind","status":"$status","bodyBytes":$body_bytes_sent,'
    '"requestSeconds":$request_time}';

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    access_log /dev/stdout live_delivery if=$live_delivery_kind;
    error_log /dev/stderr crit;

    location = /_live_authorize {
        internal;
        proxy_method GET;
        proxy_pass http://live_app$live_gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ "^/live-media/(?<stream_id>[0-9a-f-]{36})/(?<whip_path>whip(?:/[0-9a-zA-Z-]{1,128})?)$" {
        limit_except POST DELETE { deny all; }
        client_max_body_size 64k;
        set $live_gate /api/live-media/gate/$stream_id/publish;
        auth_request /_live_authorize;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_redirect ~^(/[^/]+/whip/[^/]+)$ /live-media$1;
        proxy_pass http://live_ingest/$stream_id/$whip_path;
        add_header Cache-Control "private, no-store" always;
    }

    location ~ "^/live-media/(?<stream_id>[0-9a-f-]{36})/hls/(?<asset>[a-zA-Z0-9_.-]+\.(?:m3u8|mp4|m4s|ts))$" {
        limit_except GET { deny all; }
        set $live_gate /api/live-media/gate/$stream_id/watch;
        auth_request /_live_authorize;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_redirect ~^(/[^/]+)/(.*)$ /live-media$1/hls/$2;
        proxy_buffering off;
        proxy_pass http://live_hls/$stream_id/$asset$is_args$args;
        add_header Cache-Control "private, no-store" always;
    }

    location ~ "^/live-media/(?<stream_id>[0-9a-f-]{36})/replay$" {
        limit_except GET { deny all; }
        set $live_gate /api/live-media/gate/$stream_id/replay;
        auth_request /_live_authorize;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Cache-Control;
        proxy_buffering off;
        proxy_pass http://live_recordings/get?path=$stream_id&start=$arg_start&duration=$arg_duration;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        return 404;
    }
}
