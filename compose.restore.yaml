name: renegade-cms-restore

# Isolated recovery target; use a separate .env.restore with fresh credentials.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: renegade
      POSTGRES_USER: renegade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.restore}
    volumes: [renegade_restore_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renegade -d renegade']
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    environment: &app_environment
      NODE_ENV: production
      DATABASE_URL: postgresql://renegade:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.restore}@postgres:5432/renegade
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env.restore}
      APP_URL: ${APP_URL:?Set an isolated APP_URL in .env.restore}
      PROXY_MODE: ${PROXY_MODE:-direct}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      STORAGE_DRIVER: local
      MEDIA_DIR: /app/media
      EMAIL_MODE: disabled
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      RENEGADE_IMAGE_TAG: ${RENEGADE_IMAGE_TAG:-local}
      ENABLE_TEST_ROUTES: 'false'
    command: ['npm', 'run', 'db:migrate']
    volumes: [renegade_restore_media:/app/media]
    depends_on:
      postgres:
        condition: service_healthy
  renegade-web:
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    environment: *app_environment
    ports: ['${RENEGADE_RESTORE_WEB_BIND:-127.0.0.1:3300}:3000']
    volumes: [renegade_restore_media:/app/media]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  renegade-worker:
    image: ${RENEGADE_IMAGE:-renegade-cms}:${RENEGADE_IMAGE_TAG:-local}
    environment:
      <<: *app_environment
      WORKER_HEARTBEAT_FILE: /tmp/renegade-worker/heartbeat.json
    command: ['npm', 'run', 'jobs:worker']
    volumes: [renegade_restore_media:/app/media]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'docker/worker-healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  renegade_restore_postgres_data:
  renegade_restore_media:
